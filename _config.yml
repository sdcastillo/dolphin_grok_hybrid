# SamWiki skin on GitHub's supported Cayman theme.
# https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/adding-a-theme-to-your-github-pages-site-using-jekyll
#
# Pin: remote_theme pages-themes/cayman@v0.2.0
# Skin files: assets/css/style.scss, _layouts/default.html,
# _includes/head-custom.html, _includes/samwiki-nav.html
# Pages opt in with front matter `samwiki: true`.
# Nav matches other project Pages: Home, About, Code, Linktree.

title: Dolphin Grok Hybrid
description: Local Dolphin-Mistral 7B chat, optional Grok routes, and an OpenAI-compatible API.
remote_theme: pages-themes/cayman@v0.2.0
url: https://sdcastillo.github.io
baseurl: /dolphin_grok_hybrid
samwiki: true
show_downloads: false
markdown: kramdown
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      samwiki: true

exclude:
  - README.md
  - NEW_BLUEPRINTS.md
  - main.py
  - requirements.txt
  - LICENSE
