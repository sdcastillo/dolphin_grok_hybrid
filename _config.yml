# SamWiki skin on GitHub's supported Cayman theme.
# https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/adding-a-theme-to-your-github-pages-site-using-jekyll
#
# This project site uses the remote theme pin. assets/css/style.scss imports
# jekyll-theme-cayman after the SamWiki color tokens. Pages set samwiki: true.

title: Dolphin Grok Hybrid
description: Local Dolphin-Mistral 7B chat, optional Grok routes, and an OpenAI-compatible API.
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
show_downloads: false
markdown: kramdown

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      samwiki: true

exclude:
  - README.md
  - NEW_BLUEPRINTS.md
  - main.py
  - requirements.txt
  - LICENSE
